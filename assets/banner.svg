<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <!-- Dark terminal background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <!-- Green terminal glow -->
    <radialGradient id="termGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0" />
    </radialGradient>
    <!-- Scanline effect overlay -->
    <pattern id="scanlines" x="0" y="0" width="2" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="transparent"/>
      <rect y="2" width="2" height="2" fill="#000000" opacity="0.08"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)" rx="12"/>
  <!-- Scanlines -->
  <rect width="1200" height="320" fill="url(#scanlines)" rx="12"/>
  <!-- Green center glow -->
  <ellipse cx="600" cy="160" rx="300" ry="160" fill="url(#termGlow)" filter="url(#softBlur)"/>
  <!-- Border -->
  <rect width="1200" height="320" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.35" rx="12"/>

  <!-- ── TERMINAL WINDOW CHROME (top-left) ── -->
  <rect x="30" y="22" width="260" height="90" rx="6" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <!-- Window traffic lights -->
  <circle cx="50" cy="38" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="66" cy="38" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="82" cy="38" r="5" fill="#22c55e" opacity="0.8"/>
  <!-- Terminal prompt lines -->
  <text x="46" y="62" font-family="'Courier New', Courier, monospace" font-size="11" fill="#22c55e" opacity="0.9">$ ./remote.py --bot-token &lt;TOKEN&gt;</text>
  <text x="46" y="78" font-family="'Courier New', Courier, monospace" font-size="11" fill="#4ade80" opacity="0.7">  [+] Waiting for network...</text>
  <text x="46" y="94" font-family="'Courier New', Courier, monospace" font-size="11" fill="#22c55e" opacity="0.9">  [+] Bot polling started.</text>
  <!-- Cursor blink -->
  <rect x="46" y="100" width="7" height="10" fill="#22c55e" opacity="0.85"/>

  <!-- ── TELEGRAM ICON (right decoration) ── -->
  <g transform="translate(910, 50)">
    <!-- Outer circle -->
    <circle cx="60" cy="60" r="52" fill="#229ED9" opacity="0.15"/>
    <circle cx="60" cy="60" r="48" fill="none" stroke="#229ED9" stroke-width="1.5" stroke-opacity="0.4"/>
    <!-- Paper plane shape (simplified Telegram logo) -->
    <polygon points="20,60 100,28 82,95 60,75 45,85 48,65" fill="none" stroke="#229ED9" stroke-width="2" stroke-opacity="0.7" stroke-linejoin="round"/>
    <line x1="60" y1="75" x2="100" y2="28" stroke="#229ED9" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>

  <!-- ── SSH / LOCK ICON ── -->
  <g transform="translate(1060, 56)">
    <!-- Lock body -->
    <rect x="12" y="42" width="48" height="36" rx="5" fill="none" stroke="#22c55e" stroke-width="2" stroke-opacity="0.6"/>
    <!-- Lock shackle -->
    <path d="M 22 42 L 22 28 Q 36 16 50 28 L 50 42" fill="none" stroke="#22c55e" stroke-width="2" stroke-opacity="0.6"/>
    <!-- Keyhole -->
    <circle cx="36" cy="58" r="6" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect x="33" y="61" width="6" height="8" rx="1" fill="#22c55e" opacity="0.5"/>
  </g>

  <!-- ── COMMAND BADGES (left, below terminal) ── -->
  <!-- /ssh -->
  <rect x="30" y="128" width="64" height="22" rx="11" fill="#1e3d27" stroke="#22c55e" stroke-width="1" stroke-opacity="0.5"/>
  <text x="62" y="143" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#4ade80" text-anchor="middle">/ssh</text>
  <!-- /shred -->
  <rect x="104" y="128" width="72" height="22" rx="11" fill="#3d1e1e" stroke="#ef4444" stroke-width="1" stroke-opacity="0.5"/>
  <text x="140" y="143" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle">/shred</text>
  <!-- /upload -->
  <rect x="186" y="128" width="82" height="22" rx="11" fill="#1e2a3d" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.5"/>
  <text x="227" y="143" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#93c5fd" text-anchor="middle">/upload</text>
  <!-- /encrypt -->
  <rect x="30" y="158" width="88" height="22" rx="11" fill="#2d2215" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.5"/>
  <text x="74" y="173" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">/encrypt</text>
  <!-- /where -->
  <rect x="128" y="158" width="78" height="22" rx="11" fill="#1e2a3d" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5"/>
  <text x="167" y="173" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#a5b4fc" text-anchor="middle">/where</text>

  <!-- ── MAIN TITLE ── -->
  <text x="600" y="176"
    font-family="'Courier New', Courier, monospace"
    font-size="52"
    font-weight="700"
    fill="#22c55e"
    text-anchor="middle"
    filter="url(#glow)"
    letter-spacing="2">linuxRemote</text>

  <!-- ── SUBTITLE ── -->
  <text x="600" y="212"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="16"
    font-weight="400"
    fill="#6b7280"
    text-anchor="middle"
    letter-spacing="1">Telegram-controlled remote management bot for Linux</text>

  <!-- ── DIVIDER ── -->
  <line x1="380" y1="232" x2="820" y2="232" stroke="#22c55e" stroke-width="1" stroke-opacity="0.25"/>

  <!-- ── FEATURE TAGS ── -->
  <!-- SSH Tunnels -->
  <rect x="358" y="246" width="108" height="26" rx="13" fill="#0d1f10" stroke="#22c55e" stroke-width="1" stroke-opacity="0.45"/>
  <text x="412" y="263" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#4ade80" text-anchor="middle">SSH Tunnels</text>

  <!-- Encryption -->
  <rect x="477" y="246" width="104" height="26" rx="13" fill="#1f1a0d" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.45"/>
  <text x="529" y="263" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#fbbf24" text-anchor="middle">Encryption</text>

  <!-- Cloud Sync -->
  <rect x="592" y="246" width="100" height="26" rx="13" fill="#0d1020" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.45"/>
  <text x="642" y="263" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#93c5fd" text-anchor="middle">Cloud Sync</text>

  <!-- Python -->
  <rect x="703" y="246" width="80" height="26" rx="13" fill="#1a1a1a" stroke="#6b7280" stroke-width="1" stroke-opacity="0.45"/>
  <text x="743" y="263" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#9ca3af" text-anchor="middle">Python</text>

  <!-- Systemd -->
  <rect x="794" y="246" width="90" height="26" rx="13" fill="#0d1020" stroke="#818cf8" stroke-width="1" stroke-opacity="0.45"/>
  <text x="839" y="263" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#a5b4fc" text-anchor="middle">systemd</text>

  <!-- ── BOTTOM STATUS LINE ── -->
  <text x="600" y="304"
    font-family="'Courier New', monospace"
    font-size="11"
    fill="#374151"
    text-anchor="middle">[  OK  ] Started remote.service — Secure · Password-protected · Zero-dependency install</text>
</svg>
